name: Android accessibility baseline and candidate

on:
  # Build the accessibility integration and the character-cache test branch
  # into reproducibly signed ARM64 APKs. Future pushes use the same
  # package name and the same checked-in accessibility testing certificate.
  push:
    branches:
      - integration/reader-vietnamese-20261107
      - perf/character-blueprint-cache-20261108
      - perf/reader-swipe-latency-20261109
      - feat/one-step-quantity-selection-20261110
    paths:
      - '.github/workflows/android-accessibility.yml'
      - 'android/**'
      - 'src/**'
      - 'lang/**'
      - 'data/**'
      - 'tools/accessibility/**'
      - 'tests/a11y_context_test.cpp'
  workflow_dispatch:
    inputs:
      compare_baseline:
        description: Also rebuild the pinned baseline
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/android-internal-reader'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/accessibility -p 'test_*.py' -v
      - run: bash tools/accessibility/run_core_tests.sh
      - run: bash tools/accessibility/run_speech_tests.sh
      - run: python3 tools/accessibility/inventory.py --output "$RUNNER_TEMP/a11y-inventory.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accessibility-inventory
          path: ${{ runner.temp }}/a11y-inventory.json

  android:
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/android-internal-reader'
    name: Android ARM64 (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.compare_baseline && '[{"name":"baseline","ref":"8ef359c74cc25e256919558bf7b3340f9b56a80d"},{"name":"candidate","ref":""}]' || '[{"name":"candidate","ref":""}]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.1.13356709 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext ccache glslang-tools
      - name: Compile Vulkan shader artifacts for Android assets
        run: |
          python3 tools/build_shaders.py --shader-dir data/shaders --formats spv
          test -s data/shaders/grayscale.frag.spv
      - name: Record build identity
        env:
          BUILD_KIND: ${{ matrix.name }}
        run: |
          mkdir -p build-evidence
          git rev-parse HEAD > build-evidence/commit.txt
          git status --short > build-evidence/worktree.txt
          java -version 2> build-evidence/java.txt
          sdkmanager --list_installed > build-evidence/sdk.txt
          cp android/gradle.properties build-evidence/gradle.properties
          echo "Build: $BUILD_KIND" >> "$GITHUB_STEP_SUMMARY"
          cat build-evidence/commit.txt >> "$GITHUB_STEP_SUMMARY"
      # A Java/translation/asset-only commit can reuse the exact ARM64
      # libmain.so built from the same native inputs. Never restore a library
      # from an inexact key or when any source/header/build flag has changed.
      # VERSION is derived from these inputs (not the git SHA) so the
      # compiled native version remains correct on Java-only APK updates.
      - name: Fingerprint native inputs
        if: matrix.name == 'candidate'
        id: native-inputs
        env:
          NATIVE_FINGERPRINT: ${{ hashFiles('src/**', 'android/app/jni/**', 'android/app/build.gradle', 'android/build.gradle', 'android/gradle.properties', 'android/settings.gradle') }}
        run: |
          test -n "$NATIVE_FINGERPRINT"
          echo "fingerprint=$NATIVE_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "native_version=native-${NATIVE_FINGERPRINT:0:12}" >> "$GITHUB_OUTPUT"
          printf 'native_inputs_sha256=%s\n' "$NATIVE_FINGERPRINT" > build-evidence/native.txt
      - name: Reuse verified native ARM64 library when source is unchanged
        if: matrix.name == 'candidate'
        id: cached-native
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: android/app/src/main/jniLibs/arm64-v8a/libmain.so
          key: a11y-native-libmain-v1-ndk28-arm64-${{ steps.native-inputs.outputs.fingerprint }}
      - name: Validate native library restored from exact fingerprint
        if: matrix.name == 'candidate' && steps.cached-native.outputs.cache-hit == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lib = Path('android/app/src/main/jniLibs/arm64-v8a/libmain.so')
          if not lib.is_file() or lib.stat().st_size < 100000:
              raise SystemExit('Cached native library missing or suspiciously small')
          if lib.open('rb').read(5) != b'\\x7fELF\\x02':
              raise SystemExit('Cached native library is not ELF64')
          print(f'Exact native-cache hit: {lib.stat().st_size} bytes')
          PY
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: a11y-android-arm64-ndk28-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            a11y-android-arm64-ndk28-${{ matrix.name }}-
            a11y-android-arm64-ndk28-
      - name: Download Gradle distribution (retry transient network failures)
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            echo "Gradle bootstrap attempt ${attempt}/3"
            if bash ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle distribution could not be downloaded after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Build installable debug APK
        working-directory: android
        env:
          BUILD_KIND: ${{ matrix.name }}
          NATIVE_FINGERPRINT: ${{ steps.native-inputs.outputs.fingerprint }}
          NATIVE_VERSION: ${{ steps.native-inputs.outputs.native_version }}
          REUSED_NATIVE: ${{ steps.cached-native.outputs.cache-hit }}
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_MAXSIZE: 3G
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          set -o pipefail
          # Cache statistics matter: restoring gigabytes is not proof of a
          # compiler cache hit. Record hits/misses and cache evictions.
          ccache --set-config=max_size=3G
          ccache --zero-stats
          native_args=()
          if [[ "$BUILD_KIND" == baseline ]]; then
            task_build_command=assembleExperimentalDebug
            task_signing_args=()
          else
            task_build_command=assembleAccessibilityDebug
            native_args=("-Poverride_version=$NATIVE_VERSION")
            if [[ "$REUSED_NATIVE" == 'true' ]]; then
              # Gradle already has an explicit switch to omit CMake. The
              # restored .so is placed in the standard jniLibs directory.
              test -s app/src/main/jniLibs/arm64-v8a/libmain.so
              native_args+=("-PEXCLUDE_NATIVE_LIBS=true")
              echo 'native_mode=prebuilt_verified' >> ../build-evidence/native.txt
            else
              echo 'native_mode=compile_and_seed_cache' >> ../build-evidence/native.txt
            fi
            # Never silently fall back to an ephemeral Android debug keystore.
            # GitHub's workflow run number monotonically increases across
            # pushes of this workflow. The base reserves space for older tests.
            version_code=$((100000 + ${{ github.run_number }}))
            task_signing_args=(-Paccessibility_test_signing=true
                               "-Poverride_versionCode=${version_code}")
          fi
          bash ./gradlew --no-daemon --console=plain -Pj=3 -Pabi_arm_32=false "${native_args[@]}" "${task_signing_args[@]}" "$task_build_command" 2>&1 | tee ../build-evidence/gradle.log
          ccache --show-stats --verbose | tee ../build-evidence/ccache.txt
      - name: Verify APK contents and checksums
        env:
          BUILD_KIND: ${{ matrix.name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import subprocess
          import zipfile
          apks = sorted(pathlib.Path('android/app/build/outputs/apk').rglob('*.apk'))
          if not apks:
              raise SystemExit('No APK produced')
          with pathlib.Path('build-evidence/SHA256SUMS').open('w') as out:
              for apk in apks:
                  with zipfile.ZipFile(apk) as archive:
                      names = archive.namelist()
                      for required in ('lib/arm64-v8a/libmain.so', 'assets/lang/mo/vi/LC_MESSAGES/cataclysm-dda.mo',
                                         'assets/data/shaders/grayscale.frag.spv'):
                          if required not in names:
                              raise SystemExit(f'{apk}: missing {required}')
                  signer = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/apksigner'
                  signature = subprocess.check_output([str(signer), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
                  pathlib.Path('build-evidence/signer.txt').write_text(signature)
                  if os.environ['BUILD_KIND'] == 'candidate':
                      expected = pathlib.Path('android/app/accessibility-test-cert.sha256').read_text().strip()
                      found = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', signature)
                      if not found or found.group(1).lower() != expected:
                          raise SystemExit('Candidate is not signed with the stable accessibility test key')
                      aapt = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/aapt'
                      badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
                      pkg = re.search(r"^package: name='([^']+)' versionCode='(\d+)'", badging, re.M)
                      expected_code = 100000 + int(os.environ['GITHUB_RUN_NUMBER'])
                      if not pkg or pkg.group(1) != 'com.cleverraven.cataclysmdda.accessibility':
                          raise SystemExit('APK package ID changed; it cannot update existing accessibility installs')
                      if int(pkg.group(2)) != expected_code:
                          raise SystemExit('Incorrect monotonically increasing versionCode')
                      pathlib.Path('build-evidence/package.txt').write_text(
                          f"package={pkg.group(1)}\nversionCode={pkg.group(2)}\n"
                          f"certificate_sha256={expected}\n", encoding='utf-8')
                  out.write(f'{hashlib.sha256(apk.read_bytes()).hexdigest()}  {apk}\n')
          PY
      - name: Seed exact native cache from verified installable APK
        if: success() && matrix.name == 'candidate' && steps.cached-native.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apks = sorted(Path('android/app/build/outputs/apk').rglob('*.apk'))
          if len(apks) != 1:
              raise SystemExit(f'Expected one ARM64 APK, got {len(apks)}')
          with zipfile.ZipFile(apks[0]) as archive:
              native = archive.read('lib/arm64-v8a/libmain.so')
          if not native.startswith(b'\\x7fELF\\x02') or len(native) < 100000:
              raise SystemExit('Native APK library failed ELF64 sanity check')
          destination = Path('android/app/src/main/jniLibs/arm64-v8a/libmain.so')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(native)
          print(f'Seeded verified native library: {len(native)} bytes')
          PY
      - name: Summarize stable test identity and artifact
        if: success() && matrix.name == 'candidate'
        run: |
          {
            echo '### Installable accessibility APK'
            echo 'Package: `com.cleverraven.cataclysmdda.accessibility`'
            echo 'Signing: checked-in stable accessibility testing keystore'
            cat build-evidence/native.txt
            cat build-evidence/package.txt
            cat build-evidence/SHA256SUMS
            echo 'Download from workflow artifact: `android-arm64-candidate`'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-arm64-${{ matrix.name }}
          retention-days: 14
          path: |
            build-evidence/
            android/app/build/outputs/apk/**/*.apk
            android/app/build/reports/
