name: One-time first-party comment cleanup

on:
  push:
    branches: [chore/strip-code-comments-20261119]
    paths:
      - tools/strip_code_comments.py
      - .github/workflows/one-time-strip-comments.yml

permissions:
  contents: write

concurrency:
  group: one-time-comment-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true
      - name: Strip comments from first-party code
        run: python3 tools/strip_code_comments.py
      - name: Validate source syntax and repository CI contracts
        run: |
          python3 -m compileall -q tools utilities build-scripts
          python3 -m unittest discover -s tools/accessibility -p test_repo_actions_latest_only.py -v
          git diff --check
          git diff --stat | tail -n 20
      - name: Commit changes to cleanup branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src tests tools utilities build-scripts android/app/src
          if ! git diff --cached --quiet; then
            git commit -m "style: remove nonessential first-party code comments"
            git push origin HEAD:chore/strip-code-comments-20261119
          fi
