name: One-time normalization of Python comment gaps

on:
  push:
    branches: [chore/strip-code-comments-20261119]
    paths: [.github/workflows/one-time-normalize-comments.yml]

permissions:
  contents: write

concurrency:
  group: one-time-python-blank-lines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Normalize excessive blank lines only
        run: |
          python3 -m pip install autopep8==2.3.2
          git diff --name-only -z origin/master...HEAD -- '*.py' |
            xargs -0 -r python3 -m autopep8 --select E302,E303 -i
          python3 -m compileall -q tools utilities build-scripts
          git diff --check
      - name: Commit normalized formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style(python): normalize spacing after comment cleanup"
            git push origin HEAD:chore/strip-code-comments-20261119
          fi
