name: Clean obsolete CI runs (manual, preserve latest per workflow)

# Used only to clear already-queued legacy runs. Ordinary CI automatically
# cancels superseded runs via workflow-specific concurrency groups.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: housekeeping-obsolete-ci
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Keep only the latest active CI run per workflow and branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            const self = Number(context.runId);
            const statusNames = ['queued', 'in_progress', 'waiting', 'pending'];
            const active = new Map();
            const sleep = ms => new Promise(done => setTimeout(done, ms));
            for (const status of statusNames) {
              // Read legacy runs in pages, not just the newest 100. Respect
              // the budget to avoid GitHub secondary API rate-limit errors.
              for (let page = 1; page <= 20; page++) {
                const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, status, page, per_page: 100
                });
                for (const run of data.workflow_runs) {
                  if (run.id === self || !['push', 'pull_request'].includes(run.event)) {
                    continue;
                  }
                  const pr = run.pull_requests?.[0]?.number;
                  const scope = pr ? 'pr-' + pr : 'branch-' +
                    (run.head_repository?.id || 'repo') + '-' + run.head_branch;
                  active.set(run.id, {run, key: run.workflow_id + ':' + scope});
                }
                if (data.workflow_runs.length < 100) break;
              }
            }
            const latest = new Map();
            for (const item of active.values()) {
              const old = latest.get(item.key);
              if (!old || item.run.id > old.id) latest.set(item.key, item.run);
            }
            let cancelled = 0;
            let errors = 0;
            for (const item of active.values()) {
              if (latest.get(item.key)?.id === item.run.id) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner, repo, run_id: item.run.id
                });
                cancelled++;
              } catch (e) {
                if (e.status !== 404 && e.status !== 409) {
                  errors++;
                  core.warning('Run ' + item.run.id + ': ' + e.message);
                }
              }
              await sleep(160);
            }
            core.info('Old CI cancellation requests: ' + cancelled +
              '. Errors: ' + errors + '. Latest CI runs retained: ' + latest.size);
            await core.summary.addHeading('Legacy CI queue cleanup')
              .addRaw('Requested cancellation of ' + cancelled +
                      ' older CI runs. Preserved ' + latest.size +
                      ' latest active runs, plus manual releases and maintenance tasks.')
              .write();
