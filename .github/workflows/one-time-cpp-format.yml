name: One-time C++ formatting after comment cleanup

on:
  push:
    branches: [chore/strip-code-comments-20261119]
    paths: [.github/workflows/one-time-cpp-format.yml]

permissions:
  contents: write

concurrency:
  group: one-time-cpp-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true
      - name: Format changed first-party C++ sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y astyle
          git fetch --depth=1 origin master
          git diff --name-only -z FETCH_HEAD HEAD -- 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h' 'tools/*.cpp' 'tools/*.h' |
            xargs -0 -r -P 4 -n 1 astyle --quiet --options=.astylerc -n
          git diff --check
      - name: Commit standardized C++ format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style(c++): restore astyle format after comment removal"
            git push origin HEAD:chore/strip-code-comments-20261119
          fi
