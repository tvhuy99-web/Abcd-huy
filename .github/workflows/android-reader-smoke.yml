name: Android reader native UI smoke

on:
  push:
    branches: [feature/android-internal-reader]
    paths:
      - 'android/**'
      - '.github/workflows/android-reader-smoke.yml'
      - 'tools/accessibility/run_android_smoke.sh'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-reader-smoke.yml'
      - 'tools/accessibility/run_android_smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-reader-smoke-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  reader-ui:
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/android-internal-reader'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35'
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build UI-only test APKs
        run: |
          bash android/gradlew -p android --no-daemon --console=plain \
            -PEXCLUDE_NATIVE_LIBS -Plocalize=false -Pabi_arm_32=false -Pabi_arm_64=false -Pabi_x86_64=true \
            assembleAccessibilityDebug assembleAccessibilityDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash tools/accessibility/run_android_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reader-ui-smoke
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            build-evidence/android-reader-ui/
