name: GCC 16 vehicle spawn regression

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/vehicle_group.cpp'
      - 'src/vehicle_group.h'
      - 'src/memory_fast.h'
      - 'src/do_turn.cpp'
      - '.github/workflows/gcc16-vehicle-spawn.yml'
  push:
    branches:
      - master
    paths:
      - 'src/vehicle_group.cpp'
      - 'src/vehicle_group.h'
      - 'src/memory_fast.h'
      - 'src/do_turn.cpp'
      - '.github/workflows/gcc16-vehicle-spawn.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcc16-smoke:
    name: GCC 16 compile vehicle spawning and world turn
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install GCC 16 and curses dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-16 libncursesw5-dev gettext
          g++-16 --version
      - name: Compile failure sites with release optimizations and Werror
        run: |
          make -j2 obj/vehicle_group.o obj/do_turn.o \
            CXX=g++-16 RELEASE=1 PCH=1 TESTS=0 \
            TILES=0 SOUND=0 LOCALIZE=1 LINTJSON=0 CCACHE=0
