name: Build translations
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TX_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build-translations:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout English source assets
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            lang
            src/lang_stats.inc
            data/credits
            data/motd
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare English-only language assets
        run: |
          sh lang/compile_mo.sh
          printf '\n' > src/lang_stats.inc

      # Preserve the artifact expected by release jobs, without downloading translations.
      - name: Store English source artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: translations
          include-hidden-files: true
          path: |
            lang/mo/.gitignore
            src/lang_stats.inc
            data/credits/en.credits
            data/motd/en.motd
